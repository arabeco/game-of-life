<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Widget de ciclo — Glyph</title>
<!--
  PROVA DO DESENHO DO WIDGET, ANTES DE INSTALAR.

  O widget e Java puro rodando fora da WebView: so aparece em aparelho, com
  instalacao de verdade. Esta pagina refaz o MESMO desenho em canvas, com as
  mesmas contas do GlyphWidgetPaint.java, para dar para olhar os sete patamares
  lado a lado sem gerar um AAB a cada tentativa.

  Nao e o widget. E a aritmetica dele, desenhada onde da para ver.
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 28px 20px 48px; background: #07090c; color: #e8edf4;
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  h1 { font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: #9fb0c6;
       font-weight: 700; margin: 0 0 4px; }
  p.lead { margin: 0 0 26px; font-size: 13px; color: #6f7f93; max-width: 60ch; line-height: 1.55; }
  .linha { margin-bottom: 22px; }
  .rotulo { font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
            color: #7d8ea3; margin-bottom: 7px; font-weight: 700; }
  /* 300x86 e nao 300x56.
     56dp e o `minHeight` do glyph_widget_info.xml — o MINIMO que o widget
     aceita, nao o que ele recebe. Numa celula de uma linha o launcher entrega
     perto de 100dp, e era essa diferenca que produzia a faixa vazia embaixo da
     barra de tempo no aparelho enquanto aqui o preview mostrava o conteudo
     transbordando. Preview que modela o minimo nao ajuda a julgar a folga, que
     e exatamente o que se vem olhar aqui. */
  .ficha { position: relative; width: min(620px, 100%); aspect-ratio: 300 / 86; }
  .ficha canvas.fundo { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* O miolo e desenhado em 1dp = 1px e depois AMPLIADO duas vezes.
     Sem isso a ficha saia com 620px de largura e fontes de tamanho real: sobrava
     uma faixa vazia embaixo que no aparelho nao existe, e o preview mentia
     justamente sobre o espacamento que ele deveria ajudar a julgar. */
  /* line-height 1 em tudo: e o equivalente do includeFontPadding="false" do
     Android, que e o que o layout usa. Sem isso o CSS soma meia linha por campo
     e o preview transborda uma ficha que no aparelho cabe. */
  .miolo * { line-height: 1; }
  /* `justify-content: center` e o espelho do android:gravity="center_vertical".
     Grudado no topo, a folga toda ia pro rodape e o cartao parecia cortado. */
  /* `box-sizing: border-box` porque o Android ja mede assim.
     Sem ele, `height: 86px` era a caixa de CONTEUDO e os 5px de padding somavam
     por fora: a ficha tinha 86 e o miolo ocupava 91, entao a barra de tempo
     passava alguns pixels alem da borda da placa. No aparelho isso nao acontece
     porque o padding de uma View vive DENTRO da altura dela — o preview e que
     media por outra regra. */
  .miolo { box-sizing: border-box;
           position: absolute; top: 0; left: 0; width: 310px; height: 86px;
           transform: scale(2); transform-origin: top left;
           padding: 3px 12px 2px; display: flex; flex-direction: column;
           justify-content: center; gap: 1px; }
  .faixa-titulo { position: relative; display: flex; align-items: center; gap: 6px; padding: 0 62px; min-height: 14px; }
  .faixa-titulo .periodo { position: absolute; left: 0; font-size: 8px; font-weight: 700; letter-spacing: .02em; color: #A8B6C9; }
  .faixa-titulo .linha { flex: 1; height: 1px; margin: 0; }
  /* 13px porque o layout diz android:textSize="13sp".
     Sem declarar, o titulo herdava os 16px padrao do navegador e a faixa dele
     media 23dp em vez de 14 — nove a mais, so no primeiro campo. O preview
     entao mostrava o conteudo transbordando uma ficha que no aparelho sobra. */
  .titulo { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em;
            white-space: nowrap; line-height: 1.05; }
  .sub { font-size: 9px; color: #C7D1DF; }
  .meta { font-size: 8px; font-weight: 700; text-transform: uppercase;
          letter-spacing: .02em; color: #A8B6C9; margin-top: 1px; }
  .par { display: flex; align-items: center; gap: 8px; font-size: 7px; letter-spacing: .08em;
         font-weight: 700; text-transform: uppercase; margin-top: 1px; }
  .par .dir.tempo { color: #C7D1DF; }
  .par .esq { flex: 1; color: #A8B6C9; }
  .par .dir { color: #F7F3E9; }
  .barra { height: 3px; margin-top: 1px; }
  .barra canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<h1>Widget de ciclo, por patamar</h1>
<p class="lead">O mesmo desenho do <code>GlyphWidgetPaint.java</code>, refeito em canvas.
Serve para conferir o acabamento de metal sem precisar instalar um AAB a cada tentativa.
A barra de cima e o patamar do ciclo; a de baixo e prata, que e o tempo.</p>
<div id="saida"></div>

<script type="module">
import { BARRA_OURO, BARRA_PRATA, REFLEXO_DA_BARRA } from '../constants/barrasDoCiclo.ts';
/*
 * ESPELHO DO GlyphWidgetPaint.java DE 11/10/2026, que por sua vez espelha o
 * cartao do app (CycleSummaryCard): moldura no gradiente de 118 graus do
 * acabamento, face 3dp para dentro com base, diagonal, halo, pedra e veu de 42%,
 * fio de 1dp no claro do metal so nos lados retos, corte de 5% x 20%. Com ciclo,
 * o widget mostra so: periodo, titulo, Progresso e Tempo.
 */
const METAIS = {
  SS: { face: '#3f0a18', dark: '#64401f', mid: '#c39a51', pale: '#ffe4a2', nome: 'Rubi imperial' },
  S:  { face: '#4a2169', dark: '#604421', mid: '#c6a05c', pale: '#ffe5ab', nome: 'Violeta imperial' },
  A:  { face: '#705513', dark: '#725620', mid: '#d8ae42', pale: '#fff1b8', nome: 'Ouro selado' },
  B:  { face: '#152a36', dark: '#293c48', mid: '#859ea9', pale: '#e4eff4', nome: 'Prata fria' },
  C:  { face: '#291a13', dark: '#4b3223', mid: '#b07c54', pale: '#f2c39b', nome: 'Bronze EDC' },
  D:  { face: '#101f2c', dark: '#283d4d', mid: '#68899e', pale: '#c1dce9', nome: 'Aco azulado' },
  E:  { face: '#191613', dark: '#302c29', mid: '#81756b', pale: '#d0c7bd', nome: 'Ferro carbonico' },
};
const PEDRAS = Object.fromEntries(['SSS', 'SS', 'S', 'A', 'B', 'C', 'D', 'E']
  .map((p) => [p, `/assets/cycles/plate-${p.toLowerCase()}.webp`]));
const carregar = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
const FOTOS = Object.fromEntries(await Promise.all(Object.entries(PEDRAS).map(async ([p, src]) => [p, await carregar(src)])));

const comAlfa = (hex, alfa) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alfa})`;
};
const octogono = (x0, y0, x1, y1, cx, cy) => {
  const p = new Path2D();
  p.moveTo(x0, y0 + cy); p.lineTo(x0 + cx, y0); p.lineTo(x1 - cx, y0); p.lineTo(x1, y0 + cy);
  p.lineTo(x1, y1 - cy); p.lineTo(x1 - cx, y1); p.lineTo(x0 + cx, y1); p.lineTo(x0, y1 - cy);
  p.closePath();
  return p;
};
const gradienteCss = (ctx, graus, x, y, w, h, paradas) => {
  const a = graus * Math.PI / 180, dx = Math.sin(a), dy = -Math.cos(a);
  const metade = (Math.abs(w * dx) + Math.abs(h * dy)) / 2, cx = x + w / 2, cy = y + h / 2;
  const g = ctx.createLinearGradient(cx - dx * metade, cy - dy * metade, cx + dx * metade, cy + dy * metade);
  paradas.forEach(([pos, cor]) => g.addColorStop(pos, cor));
  return g;
};
const cantoMaisLonge = (cx, cy, x0, y0, x1, y1) => Math.hypot(Math.max(cx - x0, x1 - cx), Math.max(cy - y0, y1 - cy));

/** GlyphWidgetPaint.fundo */
const desenharFundo = (canvas, metal, patamar) => {
  const dp = 3, L = 310 * dp, A = 86 * dp;
  canvas.width = L; canvas.height = A;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = gradienteCss(ctx, 118, 0, 0, L, A, [[0, metal.dark], [0.12, metal.pale], [0.4, metal.mid], [0.52, metal.pale], [0.84, metal.dark], [1, metal.pale]]);
  ctx.fill(octogono(0, 0, L, A, L * 0.05, A * 0.2));

  const m3 = 3 * dp, fx0 = m3, fy0 = m3, fx1 = L - m3, fy1 = A - m3, fw = fx1 - fx0, fh = fy1 - fy0;
  ctx.save();
  ctx.clip(octogono(fx0, fy0, fx1, fy1, fw * 0.05, fh * 0.2));
  const bx = fx0 + fw * 0.45, by = fy0 + fh * 0.1;
  const base = ctx.createRadialGradient(bx, by, 0, bx, by, cantoMaisLonge(bx, by, fx0, fy0, fx1, fy1));
  base.addColorStop(0, metal.face); base.addColorStop(0.66, '#090A0C'); base.addColorStop(1, '#111315');
  ctx.fillStyle = base; ctx.fillRect(0, 0, L, A);
  ctx.fillStyle = gradienteCss(ctx, 135, fx0, fy0, fw, fh, [[0, comAlfa(metal.mid, 0x0e / 255)], [0.35, comAlfa(metal.mid, 0)], [0.72, comAlfa(metal.mid, 0x07 / 255)], [1, comAlfa(metal.mid, 0)]]);
  ctx.fillRect(0, 0, L, A);
  const hx = fx0 + fw * 0.45, hy = fy0;
  const halo = ctx.createRadialGradient(hx, hy, 0, hx, hy, cantoMaisLonge(hx, hy, fx0, fy0, fx1, fy1));
  halo.addColorStop(0, comAlfa(metal.mid, 0x2a / 255)); halo.addColorStop(0.44, comAlfa(metal.mid, 0));
  ctx.fillStyle = halo; ctx.fillRect(0, 0, L, A);
  const foto = FOTOS[patamar];
  if (foto) {
    const e = Math.max(fw / foto.width, fh / foto.height), w = foto.width * e, h = foto.height * e;
    ctx.drawImage(foto, fx0 + (fw - w) / 2, fy0 + (fh - h) / 2, w, h);
    ctx.fillStyle = 'rgba(6, 8, 12, 0.42)'; ctx.fillRect(0, 0, L, A);
  }
  ctx.restore();

  const m5 = 5 * dp, iw = L - 2 * m5, ih = A - 2 * m5;
  ctx.save();
  ctx.clip(octogono(m5, m5, L - m5, A - m5, iw * 0.05, ih * 0.2));
  ctx.lineWidth = dp; ctx.strokeStyle = comAlfa(metal.pale, 0x38 / 255);
  ctx.strokeRect(m5 + dp / 2, m5 + dp / 2, iw - dp, ih - dp);
  ctx.restore();
};

/** GlyphWidgetPaint.barra — a receita unica de constants/barrasDoCiclo.ts. */
const desenharBarra = (canvas, forte, porcento) => {
  const L = 900, A = 12, raio = A / 2;
  canvas.width = L; canvas.height = A;
  const ctx = canvas.getContext('2d');
  const trilha = new Path2D(); trilha.roundRect(0, 0, L, A, raio);
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill(trilha);
  if (porcento > 0) {
    const cheio = Math.max(A, L * (porcento / 100));
    const metal = forte ? BARRA_OURO : BARRA_PRATA;
    const grad = ctx.createLinearGradient(0, 0, cheio, 0);
    grad.addColorStop(0, metal.escuro); grad.addColorStop(0.55, metal.meio); grad.addColorStop(1, metal.claro);
    const p = new Path2D(); p.roundRect(0, 0, cheio, A, raio);
    ctx.fillStyle = grad; ctx.fill(p);
    const reflexo = ctx.createLinearGradient(0, 0, 0, A * 0.55);
    reflexo.addColorStop(0, `rgba(255,255,255,${REFLEXO_DA_BARRA})`); reflexo.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = reflexo; ctx.fill(p);
  }
};

const saida = document.getElementById('saida');
for (const [patamar, metal] of Object.entries(METAIS)) {
  const linha = document.createElement('div');
  linha.className = 'linha';
  linha.innerHTML = `
    <div class="rotulo">${patamar} · ${metal.nome}</div>
    <div class="ficha">
      <canvas class="fundo"></canvas>
      <div class="miolo">
        <div class="faixa-titulo">
          <span class="periodo">05/10-11/10</span>
          <span class="linha esquerda"></span>
          <span class="titulo">CICLO DE OUTUBRO</span>
          <span class="linha direita"></span>
        </div>
        <div class="par"><span class="esq">Progresso</span><span class="dir">65/86 (75%)</span></div>
        <div class="barra"><canvas class="acoes"></canvas></div>
        <div class="par"><span class="esq">Tempo</span><span class="dir tempo">Dia 5/7</span></div>
        <div class="barra"><canvas class="tempo"></canvas></div>
      </div>
    </div>`;
  saida.appendChild(linha);
  desenharFundo(linha.querySelector('canvas.fundo'), metal, patamar);
  linha.querySelector('.linha.esquerda').style.background = `linear-gradient(90deg, transparent, ${comAlfa(metal.pale, 0xb8 / 255)})`;
  linha.querySelector('.linha.direita').style.background = `linear-gradient(90deg, ${comAlfa(metal.pale, 0xb8 / 255)}, transparent)`;
  linha.querySelector('.titulo').style.color = metal.pale;
  desenharBarra(linha.querySelector('canvas.acoes'), true, 75);
  desenharBarra(linha.querySelector('canvas.tempo'), false, 40);
}
</script>
<script src="/bancada-nav.js"></script>
</body>
</html>

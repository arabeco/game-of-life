<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e5dfce" />
    <title>Glyph · Estudo de natureza</title>
  </head>
  <body>
    <main id="scene" aria-label="Cena 3D de areia, árvore e pedra"></main>
    <header><span class="eyebrow">GLYPH / JARDIM ZEN</span><h1>Um lugar<br>para respirar.</h1><p>Areia, árvore e pedra.<br>Um estudo de luz e natureza.</p></header>
    <aside class="quality-panel"><strong class="approved-quality">COPA CHEIA · APROVADA</strong><small id="quality-info" role="status" aria-live="polite">Preparando materiais…</small><label for="composition">COMPOSIÇÃO</label><select id="composition" disabled><option value="kit" selected>Kit completo</option><option value="single">Árvore e pedra</option><option value="grove">Bosque · 6 árvores e 9 pedras</option></select><label class="kit-view" for="kit-theme">COLEÇÃO</label><select class="kit-view" id="kit-theme" disabled><option value="serene">Sereno</option><option value="luxury">Pátio dourado</option><option value="genesis">Gênesis</option></select><small id="sharing-info">Variações compartilham malhas e texturas.</small><details><summary>Medições do estudo</summary><output id="metrics"></output></details></aside>
    <div id="loading" role="status"><span class="pulse"></span><span id="loading-label">Preparando o jardim…</span></div>
    <footer>
      <div class="instructions">Arraste para olhar <span>·</span> Role ou use dois dedos para aproximar</div>
      <nav aria-label="Enquadramentos"><button data-view="all" aria-pressed="true">O jardim</button><button data-view="tree" aria-pressed="false">A árvore</button><button data-view="rock" aria-pressed="false">A pedra</button><button data-view="sand" aria-pressed="false">A areia</button><button data-view="water" class="kit-view" aria-pressed="false">A água</button><button data-view="details" class="kit-view" aria-pressed="false">Lanterna</button></nav>
      <div class="light"><label for="light">LUZ DO DIA</label><input id="light" type="range" min="0" max="1" step="0.01" value="0.38" aria-label="Luz do dia"/><button id="reset" aria-label="Restaurar vista inicial">↺</button></div>
      <div class="performance"><button id="motion-test" aria-pressed="false">Testar movimento</button><output id="fps" aria-label="Desempenho da cena">Em repouso</output></div>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

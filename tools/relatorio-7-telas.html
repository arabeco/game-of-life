<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatório do ciclo — 7 telas</title>
  <style>
    :root { color-scheme: dark; --gold:#b8892d; --gold2:#e7c673; --gold-deep:#594015; --ink:#090a0c; --metal:#1d2127; --muted:#9da3ad; --green:#66d8a2; --red:#db7980; /* A cor vem da nota do ciclo; esta prévia usa o azul-claro do SSS. */ --cycle-rgb:113 207 244; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; color:#f5f1e7; background:radial-gradient(circle at 50% -15%,rgb(var(--cycle-rgb) / .18) 0,transparent 34%),linear-gradient(130deg,#08090b,#13161b 48%,#08090b); font:14px/1.4 Inter, ui-sans-serif,system-ui,sans-serif; }
    button { font:inherit; cursor:pointer } .page { width:min(1180px,100%); margin:0 auto; padding:36px 20px 48px; }
    .eyebrow { color:var(--gold); text-transform:uppercase; letter-spacing:.22em; font-size:10px; font-weight:800 } h1 { margin:8px 0 5px; font:700 clamp(26px,4vw,46px)/.98 Georgia,serif; letter-spacing:.025em } .intro { max-width:720px; color:#aeb3bc; margin:0 0 24px }
    .workbench { display:grid; grid-template-columns:230px minmax(0,1fr); gap:24px; align-items:start; }
    .index { padding:10px; background:rgba(12,14,18,.72); border:1px solid #3f3c31; box-shadow:inset 0 1px rgba(255,255,255,.05),0 20px 55px #0006; }
    .index-title { padding:10px 11px 12px; color:#777f8d; font-size:10px; text-transform:uppercase; letter-spacing:.16em; font-weight:800 } .index button { width:100%; display:flex; gap:10px; align-items:center; border:0; border-left:2px solid transparent; color:#a7adb6; background:transparent; text-align:left; padding:11px; transition:.2s } .index button:hover { background:#ffffff08;color:#fff } .index button.active { border-left-color:var(--gold); color:var(--gold2); background:linear-gradient(90deg,#d9b55b18,transparent) } .index b { width:19px; font-family:Georgia,serif; font-size:16px; color:var(--gold) } .index span { font-weight:800; font-size:12px; letter-spacing:.04em }
    .stage-wrap { position:relative; min-width:0; }.stage { position:relative; min-height:690px; overflow:hidden; border:1px solid #77705b; background:radial-gradient(circle at 50% 0,rgb(var(--cycle-rgb) / .13),transparent 42%),linear-gradient(145deg,#262a30,#090a0c 49%,#13161b); box-shadow:inset 0 0 0 4px #0a0b0d,inset 0 0 0 5px #464a4f,0 25px 65px #000b,0 0 52px rgb(var(--cycle-rgb) / .08); clip-path:polygon(5% 0,95% 0,100% 4%,100% 96%,95% 100%,5% 100%,0 96%,0 4%); }
    .stage:before { content:"";position:absolute;inset:8px;pointer-events:none;border:1px solid #d9b55b3b;clip-path:inherit }.stage:after { content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;background:repeating-linear-gradient(0deg,transparent 0 3px,#ffffff04 4px 5px) }
    .top { position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:24px 31px 15px;border-bottom:1px solid #ffffff12 }.progress { display:flex;gap:6px }.progress i { width:18px;height:3px;background:#ffffff18 }.progress i.on { width:38px;background:linear-gradient(90deg,#9d7a2c,var(--gold2));box-shadow:0 0 12px #d9b55b80 }.top small { color:#89909b;font-size:10px;font-weight:800;letter-spacing:.16em }.content { position:relative;z-index:1; min-height:560px; display:flex; flex-direction:column; align-items:center; padding:30px 34px 34px; text-align:center }.kicker { color:#d9b55b;font-weight:900;font-size:10px;letter-spacing:.28em;text-transform:uppercase }.title { margin:8px 0 0;font:700 34px/.96 Georgia,serif;letter-spacing:.05em;text-transform:uppercase }.sub { color:#aeb3bc;margin:10px 0 0;font-size:13px }.hero { margin:auto 0 23px; display:flex;align-items:center;justify-content:center;min-height:230px;width:100% }.footer { position:relative;z-index:1;display:flex;justify-content:space-between;gap:12px;width:100%;margin-top:auto }.stat { flex:1;min-width:0;padding:13px 8px;border-top:1px solid #d9b55b3a;background:linear-gradient(180deg,#ffffff06,transparent) }.stat b { display:block;color:#fff4d0;font-size:20px;line-height:1;font-family:Georgia,serif }.stat small { display:block;margin-top:5px;color:#9ba1ac;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase }.foot-note { margin-top:18px;min-height:20px;color:#d4d6db;font:italic 13px/1.45 Georgia,serif }
    .ring { width:230px;height:230px;position:relative;display:grid;place-items:center;border-radius:50%;background:conic-gradient(#e3c36e 0 24%,var(--gold) 55%,var(--gold-deep) 95%,#2d3034 95% 100%);box-shadow:0 0 0 1px #e7c67335,0 0 45px #b8892d26 }.ring:before { content:"";position:absolute;inset:13px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#27261f,#08090c 66%);box-shadow:inset 0 0 25px #000 }.ring div { position:relative;text-align:center }.ring strong { display:flex;align-items:center;justify-content:center;gap:3px;margin-top:7px;white-space:nowrap;font:700 66px/.9 Georgia,serif;letter-spacing:-.05em;color:#fff5d4;text-shadow:0 4px 0 #4c3a16 }.ring .ring-percent { display:inline-block;transform:translateY(5px);font:700 42px/1 Georgia,serif;letter-spacing:-.04em }.ring .ring-label { display:block;color:var(--gold);font-size:9px;font-weight:900;letter-spacing:.19em;text-transform:uppercase }
    .bars { display:flex;align-items:end;gap:12px;height:180px;padding:0 8px;border-bottom:1px solid #fff2 }.bars span { position:relative;width:27px;min-height:11px;background:linear-gradient(#f5df91,#785a19);box-shadow:0 0 12px #d9b55b50 }.bars span.zero { background:#30343a;box-shadow:none }.bars label { position:absolute;bottom:-23px;left:50%;transform:translateX(-50%);font-size:9px;color:#9097a0 }
    .rhythm-mark { position:absolute;right:10%;top:27%;color:#f2d277;font:700 15px Georgia,serif;transform:rotate(-5deg);text-shadow:0 0 20px #d9b55b80 }.rhythm-mark:before { content:"✦";font-size:27px;margin-right:5px }
    .radar { width:min(310px,90%);filter:drop-shadow(0 0 15px #d9b55b30) }.radar polygon.grid { fill:#ffffff04;stroke:#8b825f;stroke-width:1 }.radar polygon.fill { fill:#d9b55b42;stroke:#f4d67b;stroke-width:2 }.arena-legend { display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px }.arena-legend span { padding:5px 8px;border:1px solid #ffffff15;background:#ffffff08;color:#c7cbd2;font-size:10px }.arena-legend span:first-child { border-color:#d9b55b77;color:#ffe8a3 }
    .marks { width:100%;display:grid;gap:9px;text-align:left }.mark { display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:13px 15px;border-left:3px solid var(--gold);border-top:1px solid #ffffff16;border-bottom:1px solid #ffffff0c;background:linear-gradient(90deg,#d9b55b16,#ffffff06 42%,transparent);box-shadow:inset 0 1px #fff1 }.mark .icon { color:var(--gold);font-size:22px;text-align:center }.mark b { display:block;font-size:13px;line-height:1.15 }.mark p { margin:4px 0 0;color:#aeb3bc;font-size:11px;line-height:1.35 }.mark em { color:#ffe8a3;font-style:normal }.mark .mark-value { color:#fff0bd;font:700 25px/.9 Georgia,serif;text-align:right }.mark .mark-value small { display:block;margin-top:4px;color:#8f96a0;font:800 8px/1 system-ui;letter-spacing:.1em;text-transform:uppercase }
    .loot { display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:11px;width:min(520px,100%);text-align:left }.loot .xp { grid-row:span 2;display:flex;flex-direction:column;justify-content:center;padding:22px;border:1px solid #d9b55b88;background:radial-gradient(circle at 30% 25%,#d9b55b33,transparent 52%),#13110b }.loot .xp strong { display:block;color:#fff0ad;font:700 50px/.9 Georgia,serif }.loot .xp small,.loot-card small { color:#a6adb8;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase }.loot-card { display:flex;align-items:center;gap:10px;padding:14px;border:1px solid #ffffff18;background:#ffffff08 }.loot-card i { display:grid;place-items:center;width:34px;height:34px;border:1px solid #d9b55b60;color:#ffe59a;font-style:normal;font-size:18px }.loot-card b { display:block;font-size:16px }
    .history { width:min(520px,100%);text-align:left }.history-top { display:flex;justify-content:space-between;align-items:end }.rank { color:#fff0bb;font:700 72px/.8 Georgia,serif;text-shadow:0 3px #4b3917 }.history-label { color:#aab0bb;font-size:12px;max-width:190px;padding-bottom:4px }.line { height:105px;position:relative;margin:18px 0 5px;border-bottom:1px solid #ffffff26;background:linear-gradient(transparent 49%,#ffffff0b 50%,transparent 51%) }.line svg { width:100%;height:100%;overflow:visible }.record { display:inline-flex;gap:6px;align-items:center;color:#ffe49a;border:1px solid #d9b55b72;padding:6px 9px;font-size:10px;font-weight:900;letter-spacing:.09em;text-transform:uppercase }
    .cycle-plaque { width:min(390px,100%);padding:4px;border:1px solid #b99c50;background:linear-gradient(145deg,#5a5e61,#101216 9%,#050607 84%,#43474a);box-shadow:0 12px 0 #020304,0 24px 38px #0009,0 0 45px #d9b55b20;clip-path:polygon(6% 0,94% 0,100% 7%,100% 93%,94% 100%,6% 100%,0 93%,0 7%) }.cycle-plaque-inner { padding:25px 22px 19px;clip-path:inherit;border:1px solid #d9b55b5b;background:radial-gradient(circle at 50% 30%,#53401868,transparent 50%),linear-gradient(180deg,#171b20,#070809 74%) }.plaque-kicker { color:#d9b55b;font-size:9px;font-weight:900;letter-spacing:.23em;text-transform:uppercase }.plaque-grade { margin:9px 0 5px;color:#fff1bd;font:700 92px/.72 Georgia,serif;text-shadow:0 4px #5e4717 }.plaque-name { font:700 23px/.95 Georgia,serif;letter-spacing:.07em;text-transform:uppercase }.plaque-date { margin-top:8px;color:#aab0b9;font-size:10px;letter-spacing:.09em;text-transform:uppercase }.plaque-line { height:1px;margin:18px 0 12px;background:linear-gradient(90deg,transparent,#d9b55b75,transparent) }.plaque-metrics { display:grid;grid-template-columns:repeat(3,1fr);gap:4px }.plaque-metrics span { border-right:1px solid #d9b55b30 }.plaque-metrics span:last-child { border:0 }.plaque-metrics b { display:block;color:#fff3ce;font:700 19px Georgia,serif }.plaque-metrics small { display:block;margin-top:3px;color:#9198a2;font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase }
    .controls { display:flex;align-items:center;justify-content:space-between;margin-top:15px }.controls button { min-width:105px;padding:11px 15px;color:#e9edf1;border:1px solid #ffffff20;background:#15171b;font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase }.controls button.main { color:#1b1508;border-color:#ffe487;background:linear-gradient(#fff0ae,#b6882c);box-shadow:0 6px 20px #d9b55b30 }.controls button:disabled { opacity:.3;cursor:not-allowed }.counter { color:#9299a3;font-size:11px;font-weight:800;letter-spacing:.14em }
    @media(max-width:800px){ .workbench{grid-template-columns:1fr}.index{display:flex;overflow:auto;padding:6px}.index-title{display:none}.index button{min-width:max-content;padding:8px}.index b{font-size:13px}.stage{min-height:630px}.content{padding:25px 20px}.marks{gap:7px}.mark{grid-template-columns:32px minmax(0,1fr) auto;padding:12px 9px}.mark p{font-size:10px}.mark .mark-value{font-size:21px}.footer{gap:4px}.stat b{font-size:17px}.top{padding:20px}.title{font-size:29px}.loot{grid-template-columns:1fr 1fr}.loot .xp{grid-column:span 2;grid-row:auto} }
  </style>
</head>
<body>
  <main class="page">
    <div class="eyebrow">Bancada visual · relatório do ciclo</div>
    <h1>Uma run merece um fechamento.</h1>
    <p class="intro">Sete perguntas, sete linguagens visuais. Cada tela usa os mesmos dados do Glyph, mas escolhe um único protagonista em vez de repetir números.</p>
    <section class="workbench">
      <nav class="index" aria-label="Telas do relatório">
        <div class="index-title">Quadros da run</div>
        <button class="active" data-slide="0"><b>I</b><span>Execução</span></button><button data-slide="1"><b>II</b><span>Ritmo</span></button><button data-slide="2"><b>III</b><span>Território</span></button><button data-slide="3"><b>IV</b><span>Marcas</span></button><button data-slide="4"><b>V</b><span>Conquistas</span></button><button data-slide="5"><b>VI</b><span>Contra você</span></button><button data-slide="6"><b>VII</b><span>Veredito</span></button>
      </nav>
      <div class="stage-wrap">
        <section class="stage" id="stage" aria-live="polite"></section>
        <div class="controls"><button id="prev">← Anterior</button><span class="counter" id="counter"></span><button class="main" id="next">Próxima →</button></div>
      </div>
    </section>
  </main>
  <script>
    const slides = [
      {k:'Execução', title:'O plano saiu do papel', sub:'O tamanho da entrega deste ciclo.', hero:`<div class="ring"><div><span class="ring-label">conclusão do ciclo</span><strong><span>95</span><span class="ring-percent">%</span></strong></div></div>`, stats:[['57/60','ações'],['49h','carga'],['7/7','presença'],['8,1h','por dia']], note:'Seu melhor dia foi quarta-feira: 10 entregas sem perder o ritmo.'},
      {k:'Ritmo', title:'Presença sustentada', sub:'O ciclo não foi só volume. Teve forma.', hero:`<div class="rhythm-mark">retomou forte</div><div class="bars"><span style="height:70%"><label>S</label></span><span style="height:85%"><label>T</label></span><span style="height:100%"><label>Q</label></span><span style="height:78%"><label>Q</label></span><span style="height:62%"><label>S</label></span><span style="height:77%"><label>S</label></span><span style="height:72%"><label>D</label></span></div>`, stats:[['7','dias ativos'],['7','maior sequência'],['0','dias zerados'],['2','semanas']], note:'Você sustentou presença todos os dias e atingiu o pico no meio do ciclo.'},
      {k:'Território', title:'Onde a energia foi vivida', sub:'Academia e dieta puxou a sua semana.', hero:`<svg class="radar" viewBox="0 0 320 255" aria-label="Radar das arenas"><polygon class="grid" points="160,15 279,85 234,222 86,222 41,85"/><polygon class="grid" points="160,55 241,102 211,195 109,195 79,102"/><polygon class="fill" points="160,29 249,103 189,188 111,183 78,104"/><g fill="#f7df91"><circle cx="160" cy="29" r="4"/><circle cx="249" cy="103" r="4"/><circle cx="189" cy="188" r="4"/><circle cx="111" cy="183" r="4"/><circle cx="78" cy="104" r="4"/></g><g fill="#c5cbd3" font-size="10" font-weight="700"><text x="142" y="10">SAÚDE</text><text x="281" y="89">TRABALHO</text><text x="197" y="244">PROPÓSITO</text><text x="29" y="232">RELAÇÕES</text><text x="0" y="88">LAZER</text></g></svg><div class="arena-legend"><span>✦ Academia e dieta</span><span>Rituais</span><span>Projetos</span></div>`, stats:[['27x','Academia'],['12x','Rituais'],['9x','Projetos'],['7','arenas']], note:'Seu território foi amplo, mas Saúde carregou o maior volume do ciclo.'},
      {k:'Marcas do ciclo', title:'O que esse ciclo revelou', sub:'Padrões que merecem voltar para a próxima run.', hero:`<div class="marks"><article class="mark"><div class="icon">✦</div><div><b>Melhor fôlego</b><p>Presença diária sem quebra durante o ciclo inteiro.</p></div><div class="mark-value">7<small>dias</small></div></article><article class="mark"><div class="icon">◷</div><div><b>Horário mais forte</b><p>A maior parte da carga saiu antes do almoço.</p></div><div class="mark-value">63%<small>manhã</small></div></article><article class="mark"><div class="icon">↗</div><div><b>Retomada real</b><p>Depois da menor terça, o volume cresceu no dia seguinte.</p></div><div class="mark-value">+4<small>entregas</small></div></article></div>`, stats:[], note:'Três leituras úteis para levar ao próximo ciclo — sem repetir os números dos outros quadros.'},
      {k:'Conquistas', title:'O que a run entregou', sub:'Recompensa pelo que foi sustentado.', hero:`<div class="loot"><div class="xp"><small>Experiência depositada</small><strong>+1.240</strong><small>EXP</small></div><div class="loot-card"><i>◉</i><span><small>Ouro</small><b>+10</b></span></div><div class="loot-card"><i>◇</i><span><small>Fragmentos</small><b>+8</b></span></div><div class="loot-card"><i>✦</i><span><small>Metas</small><b>7/7</b></span></div><div class="loot-card"><i>▣</i><span><small>Baú</small><b>Raro</b></span></div></div>`, stats:[['+1.240','EXP'],['7/7','metas'],['+10','ouro'],['1','baú']], note:'Os itens aparecem na placa de recompensa; aqui fica o saldo emocional da run.'},
      {k:'Contra você', title:'Seu lugar no próprio legado', sub:'Este ciclo contra a sua própria régua.', hero:`<div class="history"><div class="history-top"><strong class="rank">2º</strong><span class="history-label">melhor entre seus 6 ciclos fechados</span></div><div class="line"><svg viewBox="0 0 520 105" preserveAspectRatio="none"><polyline points="8,79 108,61 205,70 305,38 406,57 512,21" fill="none" stroke="#d9b55b" stroke-width="3"/><g fill="#fff0b0"><circle cx="8" cy="79" r="4"/><circle cx="108" cy="61" r="4"/><circle cx="205" cy="70" r="4"/><circle cx="305" cy="38" r="4"/><circle cx="406" cy="57" r="4"/><circle cx="512" cy="21" r="5"/></g></svg></div><span class="record">✦ melhor sequência pessoal</span></div>`, stats:[['95%','conclusão'],['+12%','vs. mediana'],['7','dias seguidos'],['6','ciclos']], note:'Seu ritmo ficou acima da sua mediana; a sequência é a nova marca pessoal.'},
      {k:'Veredito', title:'O ciclo entra no legado', sub:'A placa é o fechamento visual da run.', hero:`<div class="cycle-plaque"><div class="cycle-plaque-inner"><div class="plaque-kicker">Ciclo consolidado</div><div class="plaque-grade">A</div><div class="plaque-name">Ciclo 21/09</div><div class="plaque-date">21 — 27 de setembro · 7 dias</div><div class="plaque-line"></div><div class="plaque-metrics"><span><b>60/60</b><small>ações</small></span><span><b>49h</b><small>carga</small></span><span><b>7/7</b><small>metas</small></span></div></div></div>`, stats:[], note:'Execução completa e presença forte. Em um ciclo de 7 dias, o patamar máximo é A.'}
    ];
    let current=0; const stage=document.querySelector('#stage'); const counter=document.querySelector('#counter'); const buttons=[...document.querySelectorAll('[data-slide]')];
    function render(){ const s=slides[current]; const footer=s.stats.length?`<div class="footer">${s.stats.map(x=>`<div class="stat"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div>`:''; stage.innerHTML=`<header class="top"><div class="progress">${slides.map((_,i)=>`<i class="${i===current?'on':''}"></i>`).join('')}</div><small>${String(current+1).padStart(2,'0')} / 07</small></header><div class="content"><div class="kicker">${s.k}</div><h2 class="title">${s.title}</h2><p class="sub">${s.sub}</p><div class="hero">${s.hero}</div>${footer}<p class="foot-note">${s.note}</p></div>`; counter.textContent=`${current+1} de 7`; buttons.forEach((b,i)=>b.classList.toggle('active',i===current)); document.querySelector('#prev').disabled=current===0; document.querySelector('#next').textContent=current===6?'Rever relatório':'Próxima →'; }
    document.querySelector('#prev').onclick=()=>{if(current){current--;render()}}; document.querySelector('#next').onclick=()=>{current=current===6?0:current+1;render()}; buttons.forEach((b,i)=>b.onclick=()=>{current=i;render()}); window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.querySelector('#next').click();if(e.key==='ArrowLeft')document.querySelector('#prev').click()}); render();
  </script>
  <script src="/bancada-nav.js"></script>
</body>
</html>

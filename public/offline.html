<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Elite 2050</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000000;
        color: #e5e7eb;
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }
      .screen {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: radial-gradient(circle at center, #1b1b1b 0%, #000000 75%);
      }
      .panel {
        max-width: 320px;
      }
      .icon {
        font-size: 40px;
        margin-bottom: 12px;
      }
      .title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .subtitle {
        margin-top: 8px;
        font-size: 12px;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="panel">
        <div class="icon">📡</div>
        <div class="title">Conectando ao servidor da Liga...</div>
        <div class="subtitle">Sem internet no momento. Tente novamente.</div>
      </div>
    </div>
  </body>
</html>

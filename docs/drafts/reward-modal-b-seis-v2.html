<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recompensas — B reconstruído</title>
<style>
*{box-sizing:border-box} :root{color-scheme:dark;font-family:Inter,Segoe UI,Arial,sans-serif}
body{margin:0;background:#090a0d;color:#f4f1e9}.sheet{width:min(1320px,96vw);margin:auto;padding:34px 24px 64px}
header{border-bottom:1px solid #332d22;padding-bottom:18px;margin-bottom:24px}.kicker{font-size:10px;font-weight:900;letter-spacing:.3em;color:#b89453;text-transform:uppercase}
h1{margin:7px 0 6px;font:900 32px/1.05 Georgia,serif}.intro{margin:0;color:#969ba4;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,390px);justify-content:center;align-items:start;gap:30px 28px}
.case-label{margin:0 0 8px;color:#d2ad52;font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
.plate{--tone:184,146,82;position:relative;width:390px;padding:30px 28px 26px;border:3px solid #56585a;color:#f5f3ed;background:radial-gradient(ellipse at 50% -6%,rgba(var(--tone),.16),transparent 42%),linear-gradient(145deg,rgba(var(--tone),.055),transparent 35%,rgba(var(--tone),.025) 72%,transparent),linear-gradient(160deg,#1a1c1f,#090a0c 58%,#111315);box-shadow:inset 0 0 0 5px #090b0d,inset 0 0 0 6px #33363a,inset 0 0 0 9px #0b0d0f,9px 11px 0 #050607,12px 14px 0 #24272a,0 30px 86px #000,0 0 32px rgba(var(--tone),.055);clip-path:polygon(0 28px,28px 0,calc(100% - 28px) 0,100% 28px,100% calc(100% - 28px),calc(100% - 28px) 100%,28px 100%,0 calc(100% - 28px))}
.crest{width:84px;height:84px;margin:0 auto 15px;display:grid;place-items:center;border:1px solid rgba(var(--tone),.55);background:linear-gradient(135deg,#191c20,#07090b 68%);box-shadow:inset 0 0 0 5px #080a0c,inset 0 0 0 6px #30343a,5px 6px 0 #050607;clip-path:polygon(18% 0,82% 0,100% 18%,100% 82%,82% 100%,18% 100%,0 82%,0 18%)}
.crest img{width:66px;height:66px;object-fit:contain;filter:drop-shadow(0 3px 8px #000)}.eyebrow{text-align:center;color:#b7b2a8;font-size:9px;font-weight:900;letter-spacing:.32em;text-transform:uppercase}
.title{max-width:320px;margin:8px auto 7px;text-align:center;text-wrap:balance;font:900 35px/.96 Georgia,serif;letter-spacing:.06em;text-transform:uppercase}.title.medium{font-size:29px}.title.long{font-size:25px;letter-spacing:.045em}
.summary{max-width:310px;margin:0 auto 19px;text-align:center;color:#9ca0a8;font-size:11px;line-height:1.45}.metrics{display:flex;justify-content:center;flex-wrap:wrap;gap:14px}.metrics.four{gap:8px}
.metric{width:94px;height:94px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #3b3934;background:#0d0e11;text-align:center}.four .metric{width:76px;height:78px;padding:6px}
.metric-icon{width:33px;height:33px;margin-bottom:6px;display:grid;place-items:center;border:1px solid #3a3e47;background:#07090c}.four .metric-icon{width:25px;height:25px;margin-bottom:4px}.metric-icon img{width:23px;height:23px;object-fit:contain}.four .metric-icon img{width:18px;height:18px}.metric-icon.empty:after{content:"";width:12px;height:1px;background:#70747a}
.metric strong{font-size:16px;line-height:1}.four .metric strong{font-size:14px}.metric small{margin-top:5px;color:#858a93;font-size:7px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.four .metric small{margin-top:4px;font-size:6px;letter-spacing:.09em}
.section-title{display:flex;align-items:center;gap:10px;margin:18px 0 9px;color:#aaadb4;font-size:9px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}.section-title:after{content:"";height:1px;flex:1;background:#303238}
.items{display:grid;grid-template-columns:1fr 1fr;gap:7px}.item{--rarity:156,163,175;height:68px;padding:7px;display:grid;grid-template-columns:46px minmax(0,1fr);align-items:center;gap:9px;border-bottom:1px solid #302f2c;background:rgba(18,18,19,.78)}
.art{width:46px;height:46px;display:grid;place-items:center;overflow:hidden;border:1px solid rgba(var(--rarity),.48);background:radial-gradient(circle at 34% 27%,rgba(var(--rarity),.25),rgba(var(--rarity),.075) 48%,#07090b 82%);box-shadow:inset 0 0 13px rgba(var(--rarity),.09)}.art img{width:100%;height:100%;object-fit:contain}.item b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:10px;line-height:1.12}.rarity{display:block;margin-top:4px;color:rgb(var(--rarity));font-size:7px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.highlight{--rarity:59,130,246;min-height:68px;padding:10px 12px;display:grid;grid-template-columns:38px 1fr;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(135deg,rgba(255,255,255,.035),rgba(7,8,10,.72));box-shadow:inset 3px 0 0 rgba(var(--rarity),.58)}.highlight-icon{width:34px;height:34px;display:grid;place-items:center;border:1px solid #363a40;background:#090b0e;color:rgb(var(--rarity));font-size:18px}.highlight small{display:block;color:rgb(var(--rarity));font-size:8px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.highlight b{display:block;margin-top:3px;font-size:12px}.highlight span{display:block;margin-top:3px;color:#8e949d;font-size:9px}
button{display:block;width:100%;height:48px;margin-top:17px;border:1px solid var(--skin-accent-color,#ffd700);color:#1b1408;background-image:linear-gradient(180deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 38%),linear-gradient(135deg,#5c4a1f 0%,#d4af37 50%,#5c4a1f 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 24px rgba(255,215,0,.28),0 2px 6px #0008;font-weight:950;letter-spacing:.24em;text-transform:uppercase;clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,18px 100%,0 50%)}
.common{--rarity:156,163,175}.uncommon{--rarity:34,197,94}.rare{--rarity:59,130,246}.epic{--rarity:168,85,247}.legendary{--rarity:245,158,11}.mythic{--rarity:123,97,255}
@media(max-width:1260px){.grid{grid-template-columns:repeat(2,390px)}}@media(max-width:860px){.sheet{padding-inline:12px}.grid{grid-template-columns:390px}}@media(max-width:420px){.grid{grid-template-columns:minmax(0,390px)}.plate{width:100%}}
</style>
</head>
<body><main class="sheet"><header><div class="kicker">Reconstrução limpa · direção aprovada</div><h1>B — Monólito Central · seis acontecimentos</h1><p class="intro">A mesma placa. O que muda é o emblema, o conteúdo e um reflexo metálico discreto.</p></header><section class="grid" id="grid"></section></main>
<script>
const I='../../public/assets/catalog/interface/';
const A='../../public/assets/catalog/avatars/';
const V='../../public/assets/icons/';
const icon=(name,empty=false)=>`<div class="metric-icon${empty?' empty':''}">${empty?'':`<img src="${V+name}.png">`}</div>`;
const metric=(value,label,symbol)=>`<div class="metric">${icon(symbol,!symbol)}<strong>${value}</strong><small>${label}</small></div>`;
const item=(src,name,rarity='common',kind='')=>`<div class="item ${rarity}"><div class="art"><img src="${src}"></div><div><b>${name}</b><span class="rarity">${kind?kind+' · ':''}${rarity==='mythic'?'Mítico':rarity==='legendary'?'Lendário':rarity==='epic'?'Épico':rarity==='rare'?'Raro':rarity==='uncommon'?'Incomum':'Comum'}</span></div></div>`;
const data=[
 {label:'Resgate de código',tone:'245,158,11',crest:I+'recompensa_geral.png',eye:'Código resgatado',title:'Vanguarda 25',summary:'Seu código foi aceito. Tudo já entrou na conta.',metrics:[['+500','Ouro','ouro'],['+60','Fragmentos','fragmento'],['30 dias','Premium'],['Raro','Baú']],items:item(I+'borda_t1_aprendiz.png','Aprendiz','common','Borda'),button:'Continuar'},
 {label:'Missão concluída',tone:'148,163,184',crest:I+'insignia_missao_prata.png',eye:'Feito concluído',title:'Cinco dias em movimento',long:true,summary:'Você concluiu a missão e a recompensa já entrou.',metrics:[['+150','EXP','exp'],['+120','Ouro','ouro']],items:item(I+'insignia_missao_prata.png','Insígnia de Missão','uncommon'),button:'Prosseguir'},
 {label:'Ciclo fechado',tone:'184,115,51',crest:I+'insignia_ciclo_bronze.png',eye:'Ciclo fechado',title:'Reconstrução',medium:true,summary:'A EXP já entrou no seu perfil e o baú está esperando no Arsenal.',metrics:[['+3.240','EXP','exp'],['+60','Fragmentos','fragmento'],['Raro','Baú']],highlight:true,items:item(I+'insignia_ciclo_bronze.png','Insígnia de Relatório de Ciclo','common'),button:'Continuar'},
 {label:'Quest de temporada',tone:'126,58,148',crest:I+'insignia_quest_temporada.png',eye:'Selo da temporada',title:'Selo Aurora I',summary:'As três jornadas foram seladas.',metrics:[['+500','EXP','exp']],items:item('insignia-season-aurora-i-v1.png','Aurora I','mythic','Insígnia')+item(A+'SKIN_QUEST_GUARDIAO_AURORA.png','Acadêmico','uncommon','Skin'),button:'Prosseguir'},
 {label:'Conquista Genesis',tone:'123,97,255',crest:I+'insignia_season_genesis.png',eye:'Conquista da Genesis',title:'Genesis',summary:'Marca de quem esteve antes da Primeira Era começar.',metrics:[['+1.000','EXP','exp']],items:item(I+'insignia_season_genesis.png','Genesis','mythic','Insígnia'),button:'Prosseguir'},
 {label:'Subida de patente',tone:'184,146,82',crest:I+'insignia_rank_2_escudeiro.png',eye:'Nova patente',title:'Escudeiro',summary:'Sua patente subiu e o conjunto inteiro entrou no Arsenal.',metrics:[['+1.200','EXP','exp']],items:item(A+'CYBER.png','Tema Cyberpunk','epic')+item(A+'SKIN_T1_STREET.png','Street','common')+item(A+'SKIN_T1_CASUAL.png','Casual 2','common')+item(I+'borda_t1_aprendiz.png','Aprendiz','common','Borda')+item(I+'insignia_rank_2_escudeiro.png','Insígnia do Escudeiro','common')+item(I+'banner_t1_aprendiz.png','Aprendiz','common','Banner'),button:'Prosseguir'}
];
document.getElementById('grid').innerHTML=data.map(c=>`<article><h2 class="case-label">${c.label}</h2><div class="plate" style="--tone:${c.tone}"><div class="crest"><img src="${c.crest}"></div><div class="eyebrow">${c.eye}</div><div class="title ${c.long?'long':c.medium?'medium':''}">${c.title}</div><p class="summary">${c.summary}</p><div class="metrics ${c.metrics.length===4?'four':''}">${c.metrics.map(m=>metric(...m)).join('')}</div>${c.highlight?`<div class="section-title">Itens recebidos</div><div class="highlight rare"><div class="highlight-icon">▣</div><div><small>Baú conquistado</small><b>Baú de Ciclo · guardado no Arsenal</b><span>Abra quando quiser, pelo Arsenal.</span></div></div><div class="section-title">Insígnia do ciclo</div>`:`<div class="section-title">Itens recebidos</div>`}<div class="items">${c.items}</div><button>${c.button}</button></div></article>`).join('');
</script></body></html>

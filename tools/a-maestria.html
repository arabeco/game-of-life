<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A maestria — Bancada do Glyph</title>
<!--
  A TELA DE MAESTRIA, DO JEITO QUE OS AJUSTES A MONTAM.

  Monta a MasteryView DE VERDADE, `embedded`, como SettingsView a chama — com um
  GameContext de mentira que so entrega o que a tela le. Nada toca banco.

  Dois estados lado a lado: LIVRE (pode avaliar agora) e TRAVADA (avaliou ha
  um dia; a trava e de tres). E onde o botao de comecar mora, e o que muda
  entre os dois e o que a pessoa ve antes de tocar em qualquer coisa.

  Suba com `npm run bancada` e abra /a-maestria.html
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px 20px 60px; background: #0b0d10; color: #e8eaee;
         font: 14px/1.5 system-ui, sans-serif; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  header p { color: #969ca6; font-size: 12.5px; margin: 0 0 18px; max-width: 76ch; }
  code { font-family: ui-monospace, monospace; font-size: 12px; color: #d8b44c; }
  .telefones { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; }
  .telefone { width: 360px; }
  .telefone h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: .14em;
                 text-transform: uppercase; color: #8d95a1; font-weight: 700; }
  /* A altura de um telefone de verdade: a tela se distribui por ela. */
  .tela { height: 640px; border: 1px solid #272b32; border-radius: 22px;
          overflow: hidden; background: #000; display: flex; flex-direction: column; }
  .tela > * { flex: 1; min-height: 0; }
  /* O botao primario vive no index.html da RAIZ, que esta bancada nao carrega.
     Sem isto o "Avaliar" sai transparente e a gente julgaria um botao que o
     jogo nunca mostra. Copia literal do bloco de la — o mesmo que
     modais-bancada.html ja carrega. */
  :root {
    --metal-gold: linear-gradient(145deg, #f0d999, #b8892f 52%, #f4e3af);
    --sephirot-glow-color: rgba(212,175,55,.32);
    --luxe-button-text-color: #1b1408;
  }
  .luxe-skin-button {
    background-image: linear-gradient(180deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 38%), var(--ui-button-primary-bg, var(--metal-gold));
    color: var(--ui-text-on-accent, var(--luxe-button-text-color, #1b1408));
    font-weight: 800;
    border: 1px solid var(--ui-button-primary-border, var(--skin-accent-color));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 10px 24px var(--ui-button-primary-glow, var(--sephirot-glow-color)), 0 2px 6px rgba(0,0,0,.4);
    text-shadow: var(--ui-text-on-accent-shadow, var(--luxe-button-text-shadow, 0 1px 0 rgba(255,255,255,.35)));
  }
</style>
</head>
<body>
<div id="raiz"></div>
<script type="module" src="/a-maestria.tsx"></script>
<script src="/bancada-nav.js"></script>
</body>
</html>

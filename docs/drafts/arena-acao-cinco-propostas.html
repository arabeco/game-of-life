<link rel="stylesheet" href="arena-acao-propostas-v2.css">
<header class="page"><div class="eyebrow">Glyph / estudo de interface / 14.10.2026</div><h1>Uma família para arenas e ações.</h1><p>Cinco estruturas inspiradas na placa de recompensa. Compare criação e uso; ajuste os números e explore os detalhes.</p><div class="controls" id="modes"></div></header>
<main class="layout"><aside><nav class="choices" aria-label="Propostas" id="choices"></nav><section class="notes"><div class="eyebrow" id="tag"></div><h2 id="name"></h2><p id="idea"></p><p id="trade"></p></section></aside><section class="preview"><div class="device"><div class="status"><span>9:41</span><span>GLYPH · PRÉVIA</span></div><div class="stage" id="stage"></div><div class="toast hide" role="status" id="toast"></div></div><p class="preview-note">Protótipo interativo com dados de exemplo. Não salva no app.</p></section></main>
<script>
const variants=[
['01 · Placa','Placa compacta','Mais próxima da recompensa aprovada. Identidade pequena, formulário direto e medidas numa coluna.','Minha preferência inicial: pouca navegação e o essencial visível. Descrição, dificuldade e conteúdo ficam em Detalhes.'],
['02 · Eixo','Eixo lateral','Uma borda metálica guia a leitura. Nome em destaque e seções expansíveis, uma aberta por vez.','Mais sóbria e leve. Troca um pouco da presença de “recompensa” por espaço de edição.'],
['03 · Abas','Placa com abas','O mesmo corpo de metal, com Geral, Medidas e Conteúdo. Cada parte ocupa o centro da placa.','Menor altura por tela; exige tocar numa aba para conferir todas as configurações.'],
['04 · Passos','Duas etapas','Primeiro o que você quer fazer. Depois, duração e repetições em largura inteira.','É a mais tranquila para criar no celular. Em compensação, criar uma ação exige avançar uma etapa.'],
['05 · Base','Painel de base','Uma folha de metal que sobe da base. Controles próximos do polegar e mais largura útil.','É a mais diferente da recompensa: mantém material e detalhes, mas solta a moldura grossa.']];
let variant=0,mode='newaction',tab=0,step=0,expanded=false;const values={duration:30,repetitions:12,difficulty:2,name:'Ler por 30 minutos',arena:'Leitura e repertório',description:'Criar espaço para ler com atenção.'};
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const modes=[['newaction','Nova ação'],['action','Ação'],['newarena','Nova arena'],['arena','Arena']];
function field(label,key){return `<label class="field"><span>${label}</span><input type="text" data-field="${key}" value="${escape(values[key])}"></label>`}
function range(label,key,min,max,unit){return `<section class="measure"><div class="measure-header"><label for="${key}">${label}</label><div class="number"><button data-delta="-1" data-key="${key}" aria-label="Diminuir ${label}">−</button><input aria-label="${label}: valor exato" type="number" data-number="${key}" min="${min}" max="${max}" value="${values[key]}"><span>${unit}</span><button data-delta="1" data-key="${key}" aria-label="Aumentar ${label}">+</button></div></div><input id="${key}" aria-label="${label}" type="range" min="${min}" max="${max}" value="${values[key]}" data-range="${key}"><div class="scale"><span>${min} ${unit}</span><span>${max} ${unit}</span></div></section>`}
const measures=()=>range('Duração','duration',15,480,'min')+range('Repetições','repetitions',1,50,'×');
const details=()=>`<label class="field"><span>Descrição opcional</span><textarea data-field="description">${escape(values.description)}</textarea></label>${range('Dificuldade','difficulty',1,5,'/ 5')}<button class="more" data-info="Prévia de conteúdo: checklist, anotações e mídia ficam aqui.">Conteúdo e checklist <span>→</span></button><button class="more" data-info="Prévia da agenda: data e horário ficam aqui.">Agendamento <span>→</span></button>`;
const identity=()=>field('Nome da ação','name')+`<div class="section-title">Tipo</div><div class="type"><button data-type="Livre">Livre</button><button class="selected" data-type="Recorrente">Recorrente</button><button data-type="Marco">Marco</button></div>`;
const arenaFields=()=>`<label class="field"><span>Área da vida</span><select aria-label="Área da vida"><option>Intelectual</option>Física</option>Emocional</option>Social</option>Espiritual</option></select></label>${field('Nome da arena','arena')}`;
const arenaDescription=()=>`<label class="field"><span>O que você quer construir?</span><textarea data-field="description">${escape(values.description)}</textarea></label>`;
function row(title,desc,end='→'){return `<div class="row"><span class="icon">◇</span><div><strong>${escape(title)}</strong><small>${desc}</small></div><span class="end">${end}</span></div>`}
const arenaOverview=()=>`<div class="summary"><div><b>3</b><small>ações</small></div><div><b>8 / 12</b><small>conclusões</small></div><div><b>4h</b><small>registradas</small></div></div><div class="list">${row(values.name,'30 min · recorrente','6 / 12')}${row('Anotar uma ideia','15 min · livre','2 feitas')}${row('Terminar o livro','Marco','○')}</div>`;
const actionOverview=()=>`<div class="summary"><div><b>${values.duration}<small>min por vez</small></b></div><div><b>6 / ${values.repetitions}</b><small>conclusões</small></div></div><p class="desc">${escape(values.description)}</p><div class="section-title">Checklist</div><label class="row"><input type="checkbox"> Separar o livro</label><label class="row"><input type="checkbox"> Deixar o celular longe</label><button class="more" data-info="Prévia: aqui abre a anotação completa da ação.">Anotações e mídia <span>→</span></button>`;
</script>

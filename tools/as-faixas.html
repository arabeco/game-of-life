<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>As faixas — Bancada do Glyph</title>
<!--
  AS FAIXAS DE MISSAO DA ABA TEMPORADA, DE VERDADE.

  Monta o SeasonQuestCard real (views/SeasonView.tsx) com missoes de mentira,
  uma de cada familia. Nada toca banco.

  Suba com `npm run bancada` e abra /as-faixas.html
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px 20px 60px; background: #0b0d10; color: #e8eaee;
         font: 14px/1.5 system-ui, sans-serif; }
  @media (max-width: 480px) { body { padding: 10px 8px 40px; } }
  h1 { font-size: 17px; margin: 0 0 4px; }
  header p { color: #969ca6; font-size: 12.5px; margin: 0 0 12px; max-width: 76ch; }
  .telefone { width: 100%; max-width: 390px; }
  .tela { border: 1px solid #272b32; border-radius: 22px; padding: 16px; background: #000; }
  .rotulo { font: 800 10px/1 system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.62); margin: 14px 4px 8px; }
  .rotulo:first-child { margin-top: 0; }
  .log { margin-top: 12px; color: #969ca6; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>As faixas de missão</h1>
  <p>A aba Temporada com as faixas finas: uma de cada família, nos três estados. Tocar numa faixa abre o modal no app; aqui só registra o toque.</p>
</header>
<div id="raiz"></div>
<script type="module" src="/as-faixas.tsx"></script>
<script src="/bancada-nav.js"></script>
</body>
</html>
